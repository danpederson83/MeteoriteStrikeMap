server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    # App files and data: browsers keep a copy but check with the server on
    # every load (a quick "304 Not Modified" if nothing changed), so updates
    # show up right away instead of after a day.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.geojson$ {
        types { }
        default_type application/geo+json;
        add_header Cache-Control "no-cache";
    }

    # The map library only changes when we upgrade it, so let browsers keep it.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
